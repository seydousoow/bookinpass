server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Relais vers l'API (écrit par 40-env.sh, vide sans API_UPSTREAM).
  include /etc/nginx/conf.d/api.locations;

  # Configuration d'exécution : jamais en cache, elle change à chaque déploiement.
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  # index.html non mis en cache (il référence les bundles du dernier build) ; bundles nommés par empreinte : cache long.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Application monopage : toute route inconnue (/flight/booking?n=…, /flight/{offre}) rend index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

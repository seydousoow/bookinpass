<form *transloco="let t" [formRoot]="searchForm" class="grid w-full grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-[2fr_2fr_1.5fr_auto] xl:items-end">
  <bip-destination-field [formField]="searchForm.location" label="stay.search.destination"/>
  <bip-date-picker [formField]="searchForm.dates"
                   [label]="t('stay.search.dates')"
                   [maxDate]="maxDate()"
                   [minDate]="minDate"
                   [placeholder]="t('stay.search.dates-placeholder')"
                   [visibleMonths]="2"
                   mode="range"/>
  <bip-guest-selector [formField]="searchForm.guests"/>
  <button [disabled]="searchForm().invalid()" bipButton class="w-full xl:w-auto" size="lg" type="submit" variant="accent">
    {{ t('stay.search.submit') }}
  </button>
</form>

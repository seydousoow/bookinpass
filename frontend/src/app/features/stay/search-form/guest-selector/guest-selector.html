<bip-dropdown (openedChange)="open.set($event)"
              *transloco="let t; prefix: 'stay.guests'"
              [error]="touched() && invalid()"
              [label]="t('label')"
              [opened]="open()"
              [value]="summary()"
              name="stay-guests"
              panelWidth="auto">
  <div class="w-80 p-3">
    @for (row of rows(); track row.key) {
      <div class="flex min-h-11 items-center justify-between gap-3 py-1.5">
        <div class="text-muted min-w-0">
          <p class="text-sm">{{ t(row.key + '.label') }}</p>
          <p class="text-xs">{{ t(row.key + '.hint') }}</p>
        </div>

        <div class="flex items-center gap-2">
          <bip-button (clicked)="step(row.key, -1)"
                      [attr.aria-label]="t('remove', {item: t(row.key + '.label')})"
                      [disabled]="row.value <= row.min"
                      size="sm"
                      variant="outline">
            <span aria-hidden="true">−</span>
          </bip-button>
          <span aria-atomic="true" aria-live="polite" class="w-6 text-center text-sm font-semibold">{{ row.value }}</span>
          <bip-button (clicked)="step(row.key, 1)"
                      [attr.aria-label]="t('add', {item: t(row.key + '.label')})"
                      [disabled]="row.value >= row.max"
                      size="sm"
                      variant="outline">
            <span aria-hidden="true">+</span>
          </bip-button>
        </div>
      </div>
    }

    @if (value().childAges.length) {
      <div class="border-border-subtle mt-2 grid grid-cols-2 gap-2 border-t pt-3">
        @for (age of value().childAges; track $index; let i = $index) {
          <label class="text-xs">
            <span class="text-muted">{{ t('child-age', {index: i + 1}) }}</span>
            <select (change)="setAge(i, $event)"
                    class="rounded-field border-border-strong bg-surface-card bip-focusable mt-1 block min-h-10 w-full border px-2 text-sm">
              @for (option of ages; track option) {
                <option [selected]="option === age" [value]="option">{{ t('age', {count: option}) }}</option>
              }
            </select>
          </label>
        }
      </div>
      <p class="text-muted mt-2 text-xs">{{ t('age-hint') }}</p>
    }
  </div>
</bip-dropdown>

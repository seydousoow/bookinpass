<ng-container *transloco="let t">
  <section class="from-brand-dark to-brand-primary bg-linear-to-br">
    <div class="mx-auto max-w-7xl px-4 py-10 sm:py-16">
      <p class="text-xl md:text-4xl text-onbrand max-w-3xl font-bold">{{ t('home.title') }}</p>
      <p class="text-xs md:text-base text-brand-soft mt-3 max-w-3xl">{{ t('home.subtitle') }}</p>

      <bip-card class="mt-8">
        <form [formRoot]="searchForm" class="grid grid-cols-1 gap-y-3 w-full">
          <bip-radio-group [formField]="searchForm.tripType" [options]="tripTypes" appearance="segmented" hideLabel label/>

          <div class="grid gap-2 md:grid-cols-2 xl:grid-cols-4">
            <bip-location-field [formField]="searchForm.origin"
                                label="search.location.origin"
                                placeholder/>
            <bip-location-field [formField]="searchForm.destination"
                                label="search.location.destination"
                                placeholder/>
            <bip-date-picker [formField]="searchForm.dates"
                             [label]="pickerLabel"
                             [minDate]="minSearchDate"
                             [maxDate]="maxSearchDate()"
                             [mode]="pickerMode"
                             [placeholder]="t('picker.select.travel-date', {count: searchForm().value().tripType === 'oneway' ? 1 : 2})"
                             [visibleMonths]="visibleMonth"/>
            <bip-passenger-selector [formField]="searchForm.passengers"/>
          </div>

          <div class="flex flex-wrap items-end gap-3">
            <bip-select [formField]="searchForm.cabin" [options]="cabins" class="w-full sm:w-56" label="search.cabin.title"/>
            <button bipButton [disabled]="searchForm().invalid()" [loading]="searchForm().pending()" class="ml-auto w-full sm:w-auto" size="lg" type="submit" variant="accent">
              {{ t('search.submit') }}
            </button>
          </div>
        </form>
      </bip-card>
    </div>
  </section>
</ng-container>

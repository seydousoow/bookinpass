<ng-container *transloco="let t">
  <section class="from-brand-dark to-brand-primary bg-linear-to-br">
    <div class="mx-auto max-w-7xl px-4 py-10 sm:py-16">
      <p class="text-xl md:text-4xl text-onbrand max-w-3xl font-bold">{{ t('home.title') }}</p>
      <p class="text-xs md:text-base text-brand-soft mt-3 max-w-3xl">{{ t('home.subtitle') }}</p>

      <nav [attr.aria-label]="t('home.tabs.label')" class="mt-8 flex gap-1">
        @for (tab of tabs; track tab.key) {
          <a #link="routerLinkActive"
             [attr.aria-current]="link.isActive ? 'page' : null"
             [class]="link.isActive ? 'bg-surface-card text-brand-dark' : 'text-onbrand hover:bg-white/10'"
             [routerLinkActiveOptions]="{ exact: true }"
             [routerLink]="tab.route"
             class="bip-focusable rounded-t-card flex min-h-11 items-center px-4 text-sm font-semibold"
             routerLinkActive>
            {{ t('home.tabs.' + tab.key) }}
          </a>
        }
      </nav>

      <bip-card [class.rounded-tl-none]="firstTabActive()" flat="false">
        <router-outlet/>
      </bip-card>
    </div>
  </section>
</ng-container>

<div class="flex items-center gap-x-1.5">
  <input (blur)="touch.emit()"
         (change)="checked.set($any($event.target).checked)"
         [attr.aria-describedby]="hint() ? inputId() + '-hint' : null"
         [attr.aria-invalid]="showError()"
         [checked]="checked()"
         [class]="controlClass()"
         [disabled]="disabled()"
         [id]="inputId() || name()"
         [name]="name()"
         type="checkbox"/>

  <div class="min-w-0 flex-1 space-y-0.5">
    <label [for]="inputId() || name()" class="text-small text-muted block cursor-pointer font-medium select-none">
      {{ label() }}
      @if (required()) {
        <span aria-hidden="true" class="text-state-error">*</span>
      }
    </label>
  </div>
</div>
<div class="ml-6">
  @if (showError()) {
    @for (error of errors() //noinspection ForBlockNonIterableVar; track error) {
      <p class="text-label text-state-error flex items-center gap-1">
        <ng-icon color="red" name="heroExclamationCircleSolid"/>
        <span class="select-none">{{ error.message }}</span>
      </p>
    }
  } @else if (hint()) {
    <p [id]="(inputId() || name()) + '-hint'" class="text-label text-muted select-none">{{ hint() }}</p>
  }
</div>

@if (opened()) {
  <div class="fixed inset-0 z-50 flex justify-center items-center max-md:mx-3" role="presentation">
    <bip-overlay (clicked)="onBackdrop()"/>
    <div [attr.aria-label]="title()" [cdkTrapFocusAutoCapture]="true" [class]="panelClass()" aria-modal="true" cdkTrapFocus role="dialog">
      @if (showTitle()) {
        <header class="flex items-start justify-between gap-4 px-5 pt-5">
          <div class="min-w-0">
            <h2 class="text-xl text-muted">{{ title() }}</h2>
            @if (subtitle()) {
              <p class="text-sm text-muted mt-1">{{ subtitle() }}</p>
            }
          </div>
          @if (dismissible()) {
            <bip-button (clicked)="close()" size="sm" variant="ghost">
              <span class="sr-only">{{ 'common.close' | transloco }}</span>
              <ng-icon name="heroXMarkSolid"/>
            </bip-button>
          }
        </header>
      }

      <div class="flex-1 overflow-y-auto px-5 py-4">
        <ng-content/>
      </div>

      @if (showFooter()) {
        <footer class="border-border-subtle flex flex-wrap justify-end gap-2 border-t px-5 py-4">
          <ng-content select="[modalFooter]"/>
        </footer>
      }
    </div>
  </div>
}

<div class="relative">
  <label class="sr-only" for="currency-selector-mobile">{{ 'nav.currency' | transloco }}</label>

  <div #combobox="ngCombobox"
       (expandedChange)="opened.set($event)"
       [expanded]="opened()"
       class="flex min-h-9 cursor-pointer items-center gap-1.5 rounded-pill border border-border-subtle bg-surface-card px-2.5 text-xs text-muted uppercase transition-colors hover:text-brand-dark bip-focusable"
       id="currency-selector-mobile"
       ngCombobox>
    <span class="font-mono font-semibold">{{ value() }}</span>
    <ng-icon [class.rotate-180]="opened()" class="transition-transform duration-150" color="var(--color-muted)" name="heroChevronDownSolid"/>
  </div>

  <ng-template [combobox]="combobox" ngComboboxPopup popupType="listbox">
    <div class="rounded-lg border-border-subtle bg-surface-card shadow-panel absolute top-full right-0 z-30 mt-1 w-auto max-w-80 overflow-hidden">
      <ul #listbox="ngListbox"
          (valueChange)="onPick($event)"
          [activeDescendant]="listbox.activeDescendant()"
          [value]="value()"
          class="max-h-64 overflow-y-auto py-1 focus:outline-none"
          ngComboboxWidget
          ngListbox
          selectionMode="explicit">
        @for (currency of currencies(); track currency.code) {
          <li #opt="ngOption"
              [label]="currency.label"
              [value]="currency.code"
              class="flex min-h-11 cursor-pointer items-center gap-2 px-3 py-2 {{opt.active() ? 'bg-brand-soft' : 'hover:bg-brand-soft/60'}}"
              ngOption>
            <span class="text-xs w-10 shrink-0 font-mono font-semibold">{{ currency.code }}</span>
            <span class="text-sm text-ink min-w-0 flex-1 truncate capitalize">{{ currency.label }}</span>
            @if (opt.selected()) {
              <ng-icon aria-hidden="true" color="var(--color-brand-primary)" name="heroCheckSolid" size="1rem"/>
            }
          </li>
        }
      </ul>
    </div>
  </ng-template>
</div>

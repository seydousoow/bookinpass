<bip-dropdown *transloco="let t"
              (openedChange)="open.set($event)"
              [error]="touched() && invalid()"
              [label]="t('search.travelers')"
              [opened]="open()"
              [value]="summary()"
              name="people-selection"
              panelWidth="auto">
  <div class="w-72 p-3">
    @for (row of rows(); track row.key) {
      <div class="flex min-h-11 items-center justify-between gap-3 py-1.5">
        <div class="min-w-0 text-muted">
          <p class="text-sm">{{ t(row.label) }}</p>
          <p class="text-xs">{{ t(row.hint) }}</p>
        </div>

        <div class="flex items-center gap-2">
          <bip-button (clicked)="step(row.key, -1)"
                      [attr.aria-label]="t('search.passenger.remove-a') + ' ' + t(row.label)"
                      [disabled]="row.value <= row.min"
                      size="sm"
                      variant="outline">
            <span aria-hidden="true">−</span>
          </bip-button>
          <span aria-atomic="true" aria-live="polite" class="w-6 text-center text-sm font-semibold">{{ row.value }}</span>
          <bip-button (clicked)="step(row.key, 1)"
                      [attr.aria-label]="t('search.passenger.add-a') + ' ' + t(row.label)"
                      [disabled]="row.value >= row.max"
                      size="sm"
                      variant="outline">
            <span aria-hidden="true">+</span>
          </bip-button>
        </div>
      </div>
    }

    @if (hasPassengerCompositionError()) {
      <p class="border-border-subtle mt-2 border-t pt-2 text-xs text-state-error" role="alert">{{ t('search.passenger.infant.requirement') }}</p>
    }
  </div>
</bip-dropdown>

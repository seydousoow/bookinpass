<bip-field [errors]="errors()" [hideLabel]="hideLabel()" [hint]="hint()" [label]="label()" [name]="name()" [required]="required()" [showErrors]="showErrors()">
  <div [class]="controlClass()">
    <!-- Indicatif : drapeau + « +221 » ; la liste des pays s'ouvre avec une recherche (nom, indicatif ou code ISO). -->
    <button #trigger
            (click)="toggle()"
            [attr.aria-expanded]="open()"
            [attr.aria-label]="('common.phone.country' | transloco) + ' : ' + selectedName() + ' (+' + dial() + ')'"
            [disabled]="disabled()"
            aria-haspopup="listbox"
            class="border-border-strong flex shrink-0 cursor-pointer items-center gap-2 border-r px-3 text-sm focus:outline-none"
            type="button">
      <ng-icon [name]="selected()" class="w-6 h-4"/>
      <span class="font-semibold">+{{ dial() }}</span>
      <ng-icon [class.rotate-180]="open()" class="transition-transform duration-150" color="var(--color-muted)" name="heroChevronDownSolid" size="0.875rem"/>
    </button>

    <ng-template (detach)="close()"
                 (overlayOutsideClick)="onOutsideClick($event)"
                 [cdkConnectedOverlayOpen]="open()"
                 [cdkConnectedOverlay]="{origin: trigger, usePopover: 'inline'}">
      <div class="rounded-panel border-border-subtle bg-surface-card shadow-panel mt-1 pb-2.5 w-72 max-w-[calc(100vw-2rem)] overflow-hidden">
        <div class="border-border-subtle border-b p-2">
          <input #search="ngCombobox"
                 #searchField
                 (keydown.enter)="commit()"
                 (keydown.escape)="close(true)"
                 (valueChange)="query.set($event)"
                 [attr.aria-label]="'common.phone.search' | transloco"
                 [expanded]="true"
                 [placeholder]="'common.phone.search' | transloco"
                 [value]="query()"
                 autocomplete="off"
                 class="rounded-field border-border-strong text-ink placeholder:text-muted/70 w-full border px-3 py-2 text-sm focus:outline-none focus-visible:border-brand-primary"
                 ngCombobox
                 type="text"/>
        </div>
        <ng-template [combobox]="search" ngComboboxPopup popupType="listbox">
          <div #listBox="ngListbox"
               (click)="commit()"
               (keydown.enter)="commit()"
               (valueChange)="pick($event)"
               [activeDescendant]="listBox.activeDescendant()"
               [attr.aria-label]="'common.phone.country' | transloco"
               [value]="[selected()]"
               class="max-h-64 overflow-y-auto py-3 focus:outline-none"
               ngComboboxWidget
               ngListbox
               selectionMode="explicit"
               tabindex="-1">
            @for (country of filtered(); track country.code) {
              <div #opt="ngOption" [class]="optionClass(opt.active())" [label]="country.name" [value]="country.code" ngOption>
                <ng-icon [name]="country.code" class="w-6 h-4"/>
                <span [class.font-semibold]="opt.selected()" class="min-w-0 flex-1 truncate">{{ country.name }}</span>
                <span class="text-muted shrink-0">+{{ country.dial }}</span>
                @if (opt.selected()) {
                  <ng-icon aria-hidden="true" color="var(--color-brand-primary)" name="heroCheckSolid" size=".8rem"/>
                }
              </div>
            } @empty {
              <p class="text-muted px-3 py-3 text-sm select-none">{{ 'common.empty' | transloco }}</p>
            }
          </div>
        </ng-template>
      </div>
    </ng-template>

    <input #field
           (blur)="onBlur()"
           (input)="onInput($event)"
           [attr.aria-describedby]="showErrors() ? name() + '-error' : hint() ? name() + '-hint' : null"
           [attr.aria-invalid]="showErrors()"
           [attr.autocomplete]="autocomplete()"
           [disabled]="disabled()"
           [id]="name()"
           [name]="name()"
           [required]="required()"
           [value]="national()"
           class="text-ink placeholder:text-muted/70 min-w-0 flex-1 bg-transparent px-3 py-2.5 text-sm focus:outline-none"
           inputmode="tel"
           type="tel"/>
  </div>
</bip-field>

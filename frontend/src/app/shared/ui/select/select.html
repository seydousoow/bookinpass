<bip-field [errors]="errors()" [hint]="hint()" [inputId]="inputId() ?? name()" [label]="label()" [required]="required()" [showErrors]="showErrors()">
  <div class="relative">
    <div #combobox="ngCombobox"
         (blur)="touch.emit()"
         [(expanded)]="expanded"
         [class]="triggerClass()"
         [disabled]="disabled()"
         [id]="inputId() ?? name()"
         [preserveContent]="true"
         ngCombobox>
      <span [class.text-muted]="!displayValue()" class="text-small min-w-0 flex-1 truncate">
        {{ displayValue() || placeholder() }}
      </span>
      <ng-icon [class.rotate-180]="expanded()" class="duration-150 transition-transform" color="var(--color-muted)" name="heroChevronDownSolid"/>
    </div>

    <ng-template [cdkConnectedOverlayOpen]="expanded()" [cdkConnectedOverlay]="{origin: combobox.element, usePopover: 'inline', matchWidth: true}">
      <ng-template [combobox]="combobox" ngComboboxPopup popupType="listbox">
        <div class="rounded-panel border-border-subtle bg-surface-card shadow-panel absolute top-full left-0 z-30 mt-1 w-full overflow-hidden">
          <div #listBox="ngListbox"
               (click)="onCommit()"
               (keydown.enter)="onCommit()"
               (keydown.space)="onCommit()"
               (valueChange)="value.set($event)"
               [activeDescendant]="listBox.activeDescendant()"
               [multi]="multiple()"
               [value]="value()"
               class="max-h-64 overflow-y-auto py-1 focus:outline-none"
               focusMode="activedescendant"
               ngComboboxWidget
               ngListbox
               selectionMode="explicit"
               tabindex="-1">
            @for (option of options(); track option.value) {
              <div #opt="ngOption"
                   [class]="optionClass(opt.active(), !!option.disabled)"
                   [disabled]="!!option.disabled"
                   [label]="option.label"
                   [value]="option.value"
                   ngOption>
                <span class="min-w-0 flex-1">
                  <span [class.font-semibold]="opt.selected()" class="block truncate">{{ option.label }}</span>
                  @if (option.hint) {
                    <span class="text-label text-muted block truncate select-none">{{ option.hint }}</span>
                  }
                </span>
                @if (opt.selected()) {
                  <ng-icon aria-hidden="true" color="var(--color-brand-primary)" name="heroCheckSolid" size="1rem"/>
                }
              </div>
            } @empty {
              <li class="text-small text-muted px-3 py-3 select-none">{{ 'common.empty' | transloco }}</li>
            }
          </div>
        </div>
      </ng-template>
    </ng-template>
  </div>
</bip-field>

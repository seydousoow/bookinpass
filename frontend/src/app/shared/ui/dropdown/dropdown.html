<bip-outside-click (outsideClick)="close()" [outsideClickEnabled]="opened()" class="relative">
  <label [class.sr-only]="hideLabel()" [for]="name()" class="text-xs text-muted mb-1 block font-semibold">{{ label() }}</label>

  <button (click)="toggle()"
          [attr.aria-expanded]="opened()"
          [attr.aria-haspopup]="'listbox'"
          [disabled]="disabled()"
          [ngClass]="{'border-border-strong hover:border-brand-primary/60': !opened(), 'border-brand-primary': opened(), 'border-brand-error': error()}"
          class="flex min-h-11 w-full items-center gap-2 rounded-field border bg-surface-card px-3 py-2 text-left transition-colors bip-focusable"
          type="button">
    @if (prefix(); as icon) {
      <ng-icon [color]="prefixColor() || 'var(--text-ink)'" [svg]="icon"/>
    }
    <span class="flex min-w-0 flex-1 flex-col items-start text-left">
      <span [class.text-muted]="!value()" class="text-sm w-full truncate font-medium">{{ value() || placeholder() }}</span>
    </span>
    <ng-icon [class.rotate-180]="opened()" class="transition-transform duration-150" color="var(--color-muted)" name="heroChevronDownSolid"/>
  </button>

  @if (opened()) {
    <div [class.left-0]="align() === 'start'"
         [class.min-w-full]="panelWidth() === 'auto'"
         [class.right-0]="align() === 'end'"
         [class.w-full]="panelWidth() === 'trigger'"
         [class.w-max]="panelWidth() === 'auto'"
         class="rounded-panel border-border-subtle bg-surface-card shadow-panel absolute top-full z-30 mt-1 border">
      <ng-content/>
    </div>
  }
</bip-outside-click>

<div class="relative h-8">
  <!-- Track -->
  <div class="absolute top-1/2 right-0 left-0 h-1 -translate-y-1/2 rounded-full bg-surface-muted"></div>

  <!-- Selected range -->
  <div [style.left.%]="minPosition()" [style.right.%]="100 - maxPosition()" class="absolute top-1/2 h-1 -translate-y-1/2 rounded-full bg-brand-primary"></div>

  <!-- Min -->
  <input (input)="onMinInput($event)"
         [max]="max()"
         [min]="min()"
         [step]="step()"
         [value]="value().min"
         class="pointer-events-none absolute inset-0 h-8 w-full appearance-none bg-transparent
           [&::-webkit-slider-thumb]:pointer-events-auto
           [&::-webkit-slider-thumb]:h-4
           [&::-webkit-slider-thumb]:w-4
           [&::-webkit-slider-thumb]:appearance-none
           [&::-webkit-slider-thumb]:rounded-full
           [&::-webkit-slider-thumb]:bg-brand-primary
           [&::-webkit-slider-thumb]:shadow
           [&::-moz-range-thumb]:pointer-events-auto
           [&::-moz-range-thumb]:h-4
           [&::-moz-range-thumb]:w-4
           [&::-moz-range-thumb]:rounded-full
           [&::-moz-range-thumb]:border-0
           [&::-moz-range-thumb]:bg-brand-primary"
         type="range"
  />

  <!-- Max -->
  <input (input)="onMaxInput($event)"
         [max]="max()"
         [min]="min()"
         [step]="step()"
         [value]="value().max"
         class="pointer-events-none absolute inset-0 h-8 w-full appearance-none bg-transparent
           [&::-webkit-slider-thumb]:pointer-events-auto
           [&::-webkit-slider-thumb]:h-4
           [&::-webkit-slider-thumb]:w-4
           [&::-webkit-slider-thumb]:appearance-none
           [&::-webkit-slider-thumb]:rounded-full
           [&::-webkit-slider-thumb]:bg-brand-primary
           [&::-webkit-slider-thumb]:shadow
           [&::-moz-range-thumb]:pointer-events-auto
           [&::-moz-range-thumb]:h-4
           [&::-moz-range-thumb]:w-4
           [&::-moz-range-thumb]:rounded-full
           [&::-moz-range-thumb]:border-0
           [&::-moz-range-thumb]:bg-brand-primary"
         type="range"
  />
</div>

<div class="mt-2 flex justify-between text-xs">
  <span>{{ value().min | translocoCurrency : 'narrowSymbol' : {currency: currency(), minimumFractionDigits: 0, maximumFractionDigits: 2} }}</span>
  <span>{{ value().max | translocoCurrency : 'narrowSymbol' : {currency: currency(), minimumFractionDigits: 0, maximumFractionDigits: 2} }}</span>
</div>

# Backend Go : `docker compose up --build`  →  API sur http://localhost:8081
# Même contrat que le backend Spring (../backend, port 8080) ; base et cache séparés pour pouvoir lancer les deux.
# Sans DUFFEL_ACCESS_TOKEN (fichier .env, voir .env.example), l'API sert les réponses de démo.

name: bookinpass-go

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bookinpass
      POSTGRES_USER: bookinpass
      POSTGRES_PASSWORD: bookinpass
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinpass -d bookinpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: bookinpass/back-go
    environment:
      PORT: 8081
      DATABASE_URL: postgres://bookinpass:bookinpass@postgres:5432/bookinpass?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
      FIXTURES_DIR: /fixtures/duffel
    volumes:
      # Mêmes réponses de démo que le backend Spring, sans les dupliquer dans le dépôt.
      - ../backend/fixtures/duffel:/fixtures/duffel:ro
    ports:
      - "${API_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:

# Blueprint Render : API Book In Pass (offre gratuite). Render → New → Blueprint → ce dépôt.
#
# L'image (jvm ou native) est construite par GitHub Actions (.github/workflows/backend-image.yml) et publiée sur GHCR :
# Render ne fait que la tirer (pas de build Docker sur ses machines gratuites, trop petites pour GraalVM).
# Toutes les variables sont gérées depuis le tableau de bord (sync: false : le Blueprint ne les écrase jamais) ;
# seules la base et le cache sont reliés automatiquement. Valeurs conseillées en commentaire, au-dessus de chacune.

services:
  - type: web
    name: bookinpass-api
    runtime: image
    image:
      url: ghcr.io/seydousoow/bookinpass-backend:latest
    plan: free
    region: frankfurt
    healthCheckPath: /api/actuator/health/readiness
    envVars:
      # Image jvm sur 512 Mo : tas limité, GC série, compilation C1 seule (démarrage plus rapide sur 0,1 CPU).
      # Sans effet sur l'image native.
      # Valeur conseillée : -XX:MaxRAMPercentage=45 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=180m
      - key: JAVA_TOOL_OPTIONS
        sync: false
      - key: DATABASE_HOST
        fromDatabase: { name: bookinpass-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: bookinpass-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: bookinpass-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: bookinpass-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: bookinpass-db, property: password }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: bookinpass-cache, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: bookinpass-cache, property: port }

      # Site (Vercel) : retour Stripe, liens des e-mails, CORS (autres origines : CORS_ALLOWED_ORIGINS).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Valeur conseillée : https://api.duffel.com
      - key: DUFFEL_BASE_URL
        sync: false
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: DUFFEL_WEBHOOK_SECRET
        sync: false
      # Valeur conseillée : true
      - key: DUFFEL_STAYS_ENABLED
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # E-mails aux voyageurs par AWS SES : true pour les envoyer (identifiants AWS et expéditeur vérifié dans SES
      # requis) ; false = rendus et journalisés, jamais envoyés.
      # Valeur conseillée : true
      - key: MAIL_ENABLED
        sync: false
      # Valeur conseillée : us-east-2 (région du compte SES)
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Valeur conseillée : reservations@bookinpass.com
      - key: AWS_SES_SENDER
        sync: false
      # Valeur conseillée : Book In Pass
      - key: AWS_SES_ALIAS
        sync: false

  # Cache (compatible Redis), joignable seulement depuis les services Render.
  - type: keyvalue
    name: bookinpass-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: bookinpass-db
    plan: free
    region: frankfurt
    databaseName: bookinpass
    user: bookinpass
    ipAllowList: []

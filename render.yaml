# Blueprint Render : API Book In Pass (offre gratuite). Render → New → Blueprint → ce dépôt.
#
# L'image (jvm ou native) est construite par GitHub Actions (.github/workflows/backend-image.yml) et publiée sur GHCR :
# Render ne fait que la tirer (pas de build Docker sur ses machines gratuites, trop petites pour GraalVM).
# Toutes les variables sont gérées depuis le tableau de bord (sync : false : le Blueprint ne les écrase jamais) ;
# seules la base et le cache sont reliés automatiquement. Valeurs conseillées en commentaire, au-dessus de chacune.
# Attention : Render ne crée une variable sync : false qu'à la création du Blueprint. Une variable ajoutée ici
# ensuite est ignorée : l'ajouter à la main (Environment → Add → « Add from '.env' »).
version: "1"
services:
  - type: web
    domains:
      - bip-back.dicortex.com
    autoDeployTrigger: commit
    renderSubdomainPolicy: disabled
    name: bookinpass-api
    runtime: image
    image:
      url: ghcr.io/seydousoow/bookinpass-backend:latest
    plan: free
    region: frankfurt
    healthCheckPath: /api/actuator/health/readiness
    envVars:
      # Image jvm sur 512 Mo : tas limité, GC série, compilation C1 seule (démarrage plus rapide sur 0,1 CPU).
      # Sans effet sur l'image native.
      # Valeur conseillée : -XX:MaxRAMPercentage=45 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=180m
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=180m"
        sync: false
      - key: DATABASE_HOST
        fromDatabase: { name: bookinpass-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: bookinpass-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: bookinpass-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: bookinpass-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: bookinpass-db, property: password }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: bookinpass-cache, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: bookinpass-cache, property: port }

      # Journaux : niveau général, puis appels sortants (debug = URL et statut, trace = en-têtes et corps).
      # Valeur conseillée : info
      - key: LOG_LEVEL
        value: "INFO"
        sync: false
      # Valeur conseillée : info
      - key: DUFFEL_LOG_LEVEL
        value: "INFO"
        sync: false
      # Valeur conseillée : info
      - key: STAYS_LOG_LEVEL
        value: "INFO"
        sync: false
      # Valeur conseillée : info
      - key: EXPEDIA_LOG_LEVEL
        value: "INFO"
        sync: false
      # Swagger UI (/api/swagger-ui.html) et OpenAPI : false pour ne pas exposer la documentation de l'API.
      # Valeur conseillée : false
      - key: API_DOCS_ENABLED
        value: "true"
        sync: false

      # Site (Vercel) : retour Stripe, liens des e-mails, CORS (autres origines : CORS_ALLOWED_ORIGINS).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Back-office du personnel (application séparée), sur le même site que l'API : cookie de session SameSite=Lax.
      # Valeur conseillée : https://bip-admin.dicortex.com
      - key: BACKOFFICE_URL
        sync: false
      # Premier administrateur, créé au démarrage s'il n'en existe aucun ; mot de passe provisoire (10 caractères, une
      # lettre et un chiffre) à changer à la première connexion. À retirer ensuite.
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: "admin"
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
        sync: false
      # Cookie de session du back-office : Lax si le back-office est sur le même site que l"API, sinon None.
      # Valeur conseillée : Lax
      - key: STAFF_COOKIE_SAME_SITE
        value: "Lax"
        sync: false
      # Valeur conseillée : true (HTTPS)
      - key: STAFF_COOKIE_SECURE
        value: "true"
        sync: false

      # Valeur conseillée : https://api.duffel.com
      - key: DUFFEL_BASE_URL
        sync: false
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: DUFFEL_WEBHOOK_SECRET
        sync: false
      # Valeur conseillée : true
      - key: DUFFEL_STAYS_ENABLED
        sync: false

      - key: EXPEDIA_BASE_URL
        sync: false
      - key: EXPEDIA_API_KEY
        sync: false
      - key: EXPEDIA_SECRET
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # PayDunya : billets de car et activités, mobile money sur notre page (SOFTPAY) ou carte sur la page PayDunya.
      # Clés vides = moyens masqués.
      # Valeur conseillée : https://app.paydunya.com/sandbox-api/v1 (test), puis https://app.paydunya.com/api/v1
      - key: PAYDUNYA_BASE_URL
        sync: false
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      # Valeur conseillée : https://bip.dicortex.com/api/webhooks/paydunya
      - key: PAYDUNYA_CALLBACK_URL
        sync: false
      # Moyens proposés, dans cet ordre ; vide = tous (paydunya-card, wave-senegal, orange-money-senegal, wave-ci,
      # orange-money-ci, orange-money-burkina, orange-money-mali).
      - key: PAYDUNYA_METHODS
        sync: false
      # Chiffrement des numéros de mobile money (AES-256-GCM) : k1:<openssl rand -base64 32>. Rotation : k2:…,k1:…
      # (ne jamais retirer une clé tant que des paiements en dépendent). Vide = mobile money masqué.
      - key: PAYMENT_DATA_KEYS
        generateValue: true
        sync: false

      # Claude : modération des avis d'activités et résumé des avis. Clé vide = avis modérés à la main seulement.
      # Clé de compte de service limitée à un espace de travail dédié, avec expiration et limite de dépense.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Valeur conseillée : claude-haiku-5-5 (le moins cher)
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-5-5"
        sync: false
      # Réflexion du modèle (plus de jetons). Valeur conseillée : false
      - key: ANTHROPIC_THINKING
        value: "false"
        sync: false
      # Repli côté serveur quand le modèle décline (pas pour Haiku). Valeur conseillée : false
      - key: ANTHROPIC_FALLBACKS
        value: "false"
        sync: false
      # Intervalle de la modération des avis (durée ISO-8601). Valeur conseillée : PT5H
      - key: REVIEW_MODERATION_INTERVAL
        value: "PT5H"
        sync: false

      # E-mails aux voyageurs par AWS SES : true pour les envoyer (identifiants AWS et expéditeur vérifié dans SES
      # requis) ; false = rendus et journalisés, jamais envoyés.
      # Valeur conseillée : true
      - key: MAIL_ENABLED
        value: "true"
        sync: false
      # Valeur conseillée : us-east-2 (région du compte SES)
      - key: AWS_REGION
        value: "us-east-2"
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Valeur conseillée : reservations@bookinpass.com
      - key: AWS_SES_SENDER
        value: "no-reply@bip.dicortex.com"
        sync: false
      # Valeur conseillée : Book In Pass
      - key: AWS_SES_ALIAS
        value: "Book In Pass"
        sync: false

  # Cache (compatible Redis), joignable seulement depuis les services Render.
  - type: keyvalue
    name: bookinpass-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: bookinpass-db
    plan: free
    region: frankfurt
    databaseName: bookinpass
    user: bookinpass
    ipAllowList: []

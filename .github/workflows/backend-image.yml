# Image native de l'API (GraalVM) construite ici — le build demande ~8 Go de RAM, hors de portée des builders
# gratuits de Render — puis publiée sur GHCR et déployée sur Render (hook de déploiement).
#
# Secret du dépôt : RENDER_DEPLOY_HOOK_URL (Render → service → Settings → Deploy Hook). Sans lui, l'image est
# publiée et Render la reprend à son prochain déploiement manuel.
name: backend-image

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/backend-image.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bookinpass-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cible native, linux/amd64 (machines Render). -Ob : build plus court ; -march=compatibility : binaire qui
      # tourne sur tout processeur x86-64 (la valeur par défaut, x86-64-v3, exige AVX2 et planterait au démarrage sans).
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: native
          platforms: linux/amd64
          build-args: NATIVE_IMAGE_OPTIONS=-J-Xmx12g -Ob -march=compatibility
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déploiement Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"

# Tout l'environnement : `docker compose up --build`  →  API sur http://localhost:8080
# Image native GraalVM par défaut (Docker doit disposer de 10 Go) ; BACKEND_TARGET=jvm pour un build rapide.
# Sans DUFFEL_ACCESS_TOKEN (fichier .env, voir .env.example), l'API sert les réponses de démo.

name: bookinpass

services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    networks:
      - bip-egress
      - bip-internal
    environment:
      POSTGRES_DB: bookinpass
      POSTGRES_USER: bookinpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bookinpass -d bookinpass" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine3.23
    networks:
      - bip-internal
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Boîte d'e-mails de test : tout ce que le backend envoie s'affiche sur http://localhost:8025 (rien ne part).
  mailpit:
    image: axllent/mailpit:v1.27
    networks:
      - bip-internal
      - bip-egress
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP publié pour le backend lancé depuis l'IDE (MAIL_HOST=localhost).
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    build:
      context: .
      target: ${BACKEND_TARGET:-jvm}
    image: bookinpass/backend:${BACKEND_TARGET:-jvm}
    networks:
      - bip-internal
      - bip-egress
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bookinpass
      DATABASE_USER: bookinpass
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DUFFEL_BASE_URL: ${DUFFEL_BASE_URL:?Set DUFFEL_BASE_URL}
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:?Set DUFFEL_ACCESS_TOKEN}
      DUFFEL_FIXTURES_DIR: file:/fixtures/duffel/
      DUFFEL_LOG_LEVEL: ${DUFFEL_LOG_LEVEL:-info}
      DUFFEL_STAYS_ENABLED: ${DUFFEL_STAYS_ENABLED:-true}
      DUFFEL_WEBHOOK_SECRET: ${DUFFEL_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}

      # E-mails aux voyageurs : Mailpit par défaut ; un vrai SMTP via .env (MAIL_HOST vide = aucun envoi).
      MAIL_HOST: ${MAIL_HOST-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Book In Pass <reservations@bookinpass.com>}
      STAYS_LOG_LEVEL: ${STAYS_LOG_LEVEL:-info}

      EXPEDIA_BASE_URL: ${EXPEDIA_BASE_URL:-https://test.ean.com/v3}
      EXPEDIA_API_KEY: ${EXPEDIA_API_KEY:-}
      EXPEDIA_SHARED_SECRET: ${EXPEDIA_SHARED_SECRET:-}
      EXPEDIA_LOG_LEVEL: ${EXPEDIA_LOG_LEVEL:-info}

    volumes:
      # Réponses de démo, hors de l'image : elles ne servent qu'en l'absence de jeton.
      - ./fixtures/duffel:/fixtures/duffel:ro
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  bip-internal:
    internal: true

  bip-egress:
    driver: bridge
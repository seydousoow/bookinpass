# Profil de développement local (IDE, `./mvnw spring-boot:run`) : `--spring.profiles.active=dev`.
# Valeurs alignées sur les services publiés par compose.yaml (`docker compose up -d postgres redis`).
# Identifiants de développement uniquement — jamais utilisés en dehors de la machine locale.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookinpass
    username: bookinpass
    password: bookinpass

bookinpass:
  # http://localhost : le cookie de session du back-office ne peut pas être Secure.
  staff:
    cookie-secure: false

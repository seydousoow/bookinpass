spring:
  application:
    name: bookinpass-backend
  threads:
    virtual:
      enabled: true
  # Aucun identifiant ici : tout vient de l'environnement (compose.yaml, ou le profil dev pour l'IDE).
  datasource:
    # URL JDBC complète, ou à défaut hôte, port et base séparés (ce que fournissent les hébergeurs, ex. Render).
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:bookinpass}}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    # Flyway possède le schéma ; Hibernate vérifie seulement que les entités y correspondent.
    hibernate:
      ddl-auto: validate
    # Pas de session Hibernate ouverte pendant le rendu de la réponse : tout accès paresseux hors
    # service échoue tout de suite au lieu de déclencher des requêtes cachées.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis ne sert que de cache : pas de dépôts Spring Data Redis (évite de réexaminer les dépôts JPA au démarrage).
      repositories:
        enabled: false

  cache:
    type: redis

  # Sujets des e-mails (i18n/mail_fr.properties, i18n/mail_en.properties).
  messages:
    basename: i18n/mail
    encoding: UTF-8
    fallback-to-system-locale: false

  flyway:
    locations: classpath:db/migration

  web:
    error:
      include-message: never
  main:
    banner-mode: console
# Image native : le crochet d'arrêt de Logback n'y a pas sa place (Spring gère l'arrêt).
logging:
  register-shutdown-hook: false
  level:
    # Appels sortants : debug = URL et statut, trace = en-têtes et corps en plus (Authorization masqué).
    com.bookinpass.backend.client.DuffelClient: ${DUFFEL_LOG_LEVEL:info}
    com.bookinpass.backend.client.StaysClient: ${STAYS_LOG_LEVEL:info}
    com.bookinpass.backend.client.ExpediaClient: ${EXPEDIA_LOG_LEVEL:info}
    root: ${LOG_LEVEL:info}

server:
  port: ${PORT:8080}
  # Les recherches Duffel pèsent jusqu'à ~17 Mo de JSON : la compression les ramène à ~1 Mo.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI / Swagger UI (springdoc). Activés par défaut ; à couper en production publique si le contrat ne doit
# pas être exposé : API_DOCS_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    syntax-highlight:
      activated: false
    display-request-duration: true
  paths-to-match: /**
  default-produces-media-type: application/json

bookinpass:
  # Paiement Stripe (Payment Element). Vides = paiement indisponible (503 `payments-unavailable`).
  stripe:
    base-url: https://api.stripe.com
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    # ui_mode=form (formulaire Checkout intégré) : Dahlia ou plus récent.
    api-version: 2026-09-30.endive
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  duffel:
    base-url: ${DUFFEL_BASE_URL:https://api.duffel.com}
    # Vide = mode démo : les réponses viennent des fixtures (fixtures-dir ci-dessous).
    access-token: ${DUFFEL_ACCESS_TOKEN:}
    api-version: v2
    supplier-timeout: 20s
    read-timeout: 40s
    # Relatif au dossier de lancement (racine du dépôt) ; Docker monte le dossier sur /fixtures/duffel.
    fixtures-dir: ${DUFFEL_FIXTURES_DIR:file:fixtures/duffel/}
    # Duffel Stays est un produit à activer sur le compte : sans lui, /stays/search répond 403.
    stays-enabled: ${DUFFEL_STAYS_ENABLED:true}
    stays-radius-km: 50
    # Rendu une seule fois par POST /air/webhooks (voir README) : vide = webhooks Duffel refusés.
    webhook-secret: ${DUFFEL_WEBHOOK_SECRET:}
  expedia:
    base-url: ${EXPEDIA_BASE_URL:}
    api-key: ${EXPEDIA_API_KEY:}
    secret: ${EXPEDIA_SECRET:}
    read-timeout: 30s
  cache:
    flight-search-ttl: 10m
    flight-offer-max-ttl: 15m
    seat-maps-ttl: 10m
    airports-ttl: 24h
    airlines-ttl: 24h
    rates-ttl: 1h
    stay-search-ttl: 10m
    stay-rates-max-ttl: 5m
    stay-reviews-ttl: 24h
    flight-order-ttl: 7d
  # E-mails aux voyageurs (réservation, modification, annulation), envoyés par AWS SES. false = rendus et journalisés,
  # jamais envoyés (développement sans compte AWS).
  mail:
    enabled: ${MAIL_ENABLED:false}
    site-url: ${FRONTEND_URL:http://localhost:4200}
  # Origines du front autorisées (CORS), séparées par des virgules ; par défaut celle de FRONTEND_URL.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:4200}}
  # PayDunya : billets de car et activités, mobile money sur notre page (SOFTPAY) ou carte sur la page PayDunya.
  # Montants en francs CFA entiers. Clés vides = moyens masqués.
  paydunya:
    base-url: ${PAYDUNYA_BASE_URL:https://app.paydunya.com/sandbox-api/v1}
    master-key: ${PAYDUNYA_MASTER_KEY:}
    private-key: ${PAYDUNYA_PRIVATE_KEY:}
    token: ${PAYDUNYA_TOKEN:}
    # Moyens proposés, dans cet ordre d'affichage ; vide = tous : paydunya-card, wave-senegal, orange-money-senegal,
    # wave-ci, orange-money-ci, orange-money-burkina, orange-money-mali.
    methods: ${PAYDUNYA_METHODS:}
    # Adresse publique de l'IPN (PayDunya l'appelle depuis Internet) : https://<domaine de l'API>/api/webhooks/paydunya
    callback-url: ${PAYDUNYA_CALLBACK_URL:}
    store-name: Book In Pass
  # Chiffrement des numéros de mobile money conservés (AES-256-GCM) : <id>:<clé de 32 octets en base64>, la plus récente
  # en tête, séparées par des virgules (rotation). Vide = mobile money masqué. Clé : openssl rand -base64 32
  payment-data:
    keys: ${PAYMENT_DATA_KEYS:}
  # Claude : modération des avis d'activités et résumé des avis. Clé vide = avis modérés à la main seulement.
  anthropic:
    base-url: https://api.anthropic.com
    # Clé de compte de service limitée à un espace de travail, avec expiration et limite de dépense sur cet espace.
    api-key: ${ANTHROPIC_API_KEY:}
    # Le modèle le moins cher ; réflexion coupée : classer et résumer n'en ont pas besoin.
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    thinking: ${ANTHROPIC_THINKING:false}
    api-version: 2026-10-21
    # Repli côté serveur quand le modèle décline : Opus 5.5, Opus 5, Fable, Sonnet 5.5 seulement (pas Haiku).
    fallbacks: ${ANTHROPIC_FALLBACKS:false}
    read-timeout: 60s
  # Modération des avis par Claude : un lot d'avis en attente à chaque passage (durée ISO-8601, ex. PT5H = 5 heures).
  reviews:
    moderation-interval: ${REVIEW_MODERATION_INTERVAL:PT5H}
  # Back-office du personnel (application séparée). Cookie de session HttpOnly, SameSite=Lax : le back-office doit
  # être servi depuis le même site que l'API (ex. bip-admin.dicortex.com et bip-back.dicortex.com).
  staff:
    # Origines du back-office : CORS avec cookies, et seules origines admises pour les écritures (protection CSRF).
    allowed-origins: ${BACKOFFICE_URL:http://localhost:4300}
    session-ttl: 12h
    cookie-name: bip_staff
    cookie-same-site: ${STAFF_COOKIE_SAME_SITE:Lax}
    cookie-secure: ${STAFF_COOKIE_SECURE:true}
    # Premier administrateur, créé au démarrage s'il n'en existe aucun (mot de passe à changer à la connexion).
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

# Expéditeur SES : adresse vérifiée dans SES (domaine ou adresse), nom affiché, région du compte SES. Identifiants :
# chaîne AWS habituelle (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, profil, rôle IAM).
aws:
  ses:
    region: ${AWS_REGION:us-east-2}
    sender: ${AWS_SES_SENDER:no-reply@bookinpass.dicortex.com}
    alias: ${AWS_SES_ALIAS:Book In Pass}
